{% extends 'base.html' %}
{% block content %}
<section class="section-light">
  <div class="container contact-grid">
    <div>
      <h1>Contact Us</h1>
      <p>Have questions about our products? Want to place a custom order? We'd love to hear from you!</p>
      <div class="info-block">
        <h2>Email</h2>
        <p>heartofthegemllc@gmail.com</p>
      </div>
      <div class="info-block">
        <h2>Phone</h2>
        <p>360-244-2953</p>
      </div>
      <div class="info-block">
        <h2>Social Media</h2>
        <p class="social-links"><a class="social-links" href="http://www.instagram.com/heartofthegem?igsh=NTc4MTIwNjQ2YQ%3D%3D&utm_source=qr" target="_blank"><img class="icon" src="assets/icons/instagram.svg" alt="Instagram">Instagram</a><a class="social-links" href="http://www.tiktok.com/@heart.of.the.gem?_r=1&_t=ZT-96ARomhs2ne" target="_blank"><img class="icon" src="assets/icons/tiktok.svg" alt="TikTok">TikTok</a><a class="social-links" href="https://www.etsy.com" target="_blank"><img class="icon" src="assets/icons/etsy.svg" alt="Etsy">Etsy</a></p>
      </div>
    </div>
    <div>
      <form method="post" class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button type="submit" class="button primary">Send Message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
